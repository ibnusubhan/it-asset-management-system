<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Asset Manager</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            overflow-x: hidden;
        }
        /* Style untuk Sidebar */
        #sidebar {
            min-width: 240px;
            max-width: 240px;
            min-height: 100vh;
        }
        #sidebar .nav-link {
            color: rgba(255, 255, 255, 0.8);
            padding: 12px 20px;
            font-weight: 500;
            border-radius: 6px;
            margin-bottom: 4px;
        }
        #sidebar .nav-link:hover, #sidebar .nav-link.active {
            color: #ffffff;
            background-color: rgba(255, 255, 255, 0.15);
        }
        /* Penyesuaian Responsif di Layar HP */
        @media (max-width: 768px) {
            #sidebar {
                min-width: 100%;
                max-width: 100%;
                min-height: auto;
            }
            .main-wrapper {
                flex-direction: column;
            }
        }
    </style>
</head>
<body class="bg-light">

    <div class="d-flex main-wrapper">
        <!-- Sidebar Navigation -->
        <nav id="sidebar" class="bg-dark p-3 d-flex flex-column justify-content-between">
            <div>
                <!-- Logo / Judul Aplikasi -->
                <a href="/" class="d-flex align-items-center mb-4 text-white text-decoration-none px-2">
                    <span class="fs-4 fw-bold">💻 IT Asset</span>
                </a>
                <hr class="text-secondary">
                
                <!-- Menu Navigasi Sidebar -->
              <ul class="nav nav-pills flex-column mb-auto">
    <li class="nav-item">
        <a href="/" class="nav-link text-white">📋 Data Aset</a>
    </li>
    <li>
        <a href="/add-batch" class="nav-link text-white">📦 Pengadaan Batch (Grosir)</a>
    </li>
    <li>
        <a href="/add" class="nav-link text-white">➕ Register Aset Tunggal</a>
    </li>
    <li>
        <a href="/employees" class="nav-link text-white">👥 Karyawan</a>
    </li>
    <li>
        <a href="/logs" class="nav-link text-white">📜 Riwayat / Logs</a>
    </li>
</ul>
            </div>


            <!-- Profil & Logout di Bawah Sidebar -->
            <div class="pt-3 border-top border-secondary">
                <div class="d-flex align-items-center justify-content-between mb-2 px-1">
                    <span class="text-white small">👤 <strong>{{ current_user.username }}</strong></span>
                    <a href="/logout" class="badge bg-danger text-decoration-none py-1 px-2">Logout</a>
                </div>
            </div>

        </nav>

 
          

        <!-- Main Content Area (Isi Halaman Utama) -->
        <div class="flex-grow-1 p-4" style="overflow-y: auto; max-height: 100vh;">
            {% block content %}{% endblock %}
        </div>
    </div>
    

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
