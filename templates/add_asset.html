{% extends 'base.html' %}

{% block content %}
<div class="card shadow-sm col-md-10 mx-auto">
    <div class="card-header bg-white fw-bold fs-5">
        Tambah Aset Baru
    </div>
    <div class="card-body">
        <form action="/add" method="POST">
            <!-- 1. Informasi Utama -->
            <h6 class="fw-bold border-bottom pb-2 text-primary">Informasi Utama</h6>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Asset Tag *</label>
                    <input type="text" name="asset_tag" class="form-control" placeholder="ast-001" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Nama Perangkat *</label>
                    <input type="text" name="name" class="form-control" placeholder="Laptop Lenovo X1" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Kategori *</label>
                    <select name="category" class="form-select" required>
                        <option value="Laptop">Laptop</option>
                        <option value="Desktop PC">Desktop PC</option>
                        <option value="Monitor">Monitor</option>
                        <option value="Printer/Scanner">Printer/Scanner</option>
                        <option value="Network Hardware">Network Hardware</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Serial Number</label>
                    <input type="text" name="serial_number" class="form-control" placeholder="SN12345678">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Status *</label>
                    <select name="status" class="form-select" required>
                        <option value="Available">Available</option>
                        <option value="In Use">In Use</option>
                        <option value="Repair">Repair</option>
                        <option value="Retired">Retired</option>
                    </select>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Pengguna (Karyawan)</label>
                    <select name="user_id" class="form-select">
                        <option value="">-- Pilih Pengguna (Opsional) --</option>
                        {% for emp in employees %}
                        <option value="{{ emp.id }}">{{ emp.full_name }} ({{ emp.department }})</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- 2. Informasi Pengadaan & Garansi -->
            <h6 class="fw-bold border-bottom pb-2 mt-4 text-primary">Pengadaan & Garansi</h6>
            <div class="row g-3 mb-3">
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Tanggal Pembelian</label>
                    <input type="date" name="purchase_date" class="form-control">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">No. Purchase Order (PO)</label>
                    <input type="text" name="po_number" class="form-control" placeholder="PO/2024/001">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Masa Garansi Berakhir</label>
                    <input type="date" name="warranty_expiry" class="form-control">
                </div>
            </div>

            <!-- 3. Spesifikasi Perangkat -->
            <h6 class="fw-bold border-bottom pb-2 mt-4 text-primary">Spesifikasi Perangkat (Untuk Kelayakan)</h6>
            <div class="row g-3 mb-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">Processor</label>
                    <input type="text" name="processor" class="form-control" placeholder="e.g. Intel Core i5-1135G7 / Apple M1">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">RAM</label>
                    <select name="ram" class="form-select">
                        <option value="-">-</option>
                        <option value="4 GB">4 GB</option>
                        <option value="8 GB">8 GB</option>
                        <option value="16 GB">16 GB</option>
                        <option value="32 GB">32 GB</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Penyimpanan (SSD/HDD)</label>
                    <input type="text" name="storage" class="form-control" placeholder="e.g. 512GB SSD">
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Sistem Operasi (OS)</label>
                    <select name="os" class="form-select">
                        <option value="-">-</option>
                        <option value="Windows 10">Windows 10</option>
                        <option value="Windows 11">Windows 11</option>
                        <option value="macOS">macOS</option>
                        <option value="Linux">Linux</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label fw-semibold">Microsoft Office</label>
                    <input type="text" name="office" class="form-control" placeholder="e.g. Office 2021 / M365">
                </div>
            </div>

            <!-- Catatan -->
            <div class="mb-4">
                <label class="form-label fw-semibold">Catatan</label>
                <textarea name="notes" class="form-control" rows="3" placeholder="Kondisi fisik, kelengkapan charger, dll."></textarea>
            </div>

            <div class="d-flex justify-content-between">
                <a href="/" class="btn btn-secondary">Batal</a>
                <button type="submit" class="btn btn-primary">Simpan Aset</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
